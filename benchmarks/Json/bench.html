<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Benchmark JSON</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .line-through { text-decoration: line-through; }
        .hidden { display: none !important; }
    </style>
    <base target="_blank">
</head>
<body class="bg-slate-50 font-sans text-slate-800 min-h-screen p-6">
<div class="max-w-7xl mx-auto">
    <h1 class="text-3xl font-bold text-slate-900 mb-6">Benchmark JSON - Análise de Desempenho</h1>

    <!-- Painel de Controle -->
    <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 mb-8 grid md:grid-cols-2 gap-6">
        <div class="flex flex-col gap-2">
            <h3 class="text-sm font-bold text-slate-500 uppercase tracking-wider mb-1">Adicionar Novo Teste</h3>
            <input type="text" id="newRunName" placeholder="Nome do teste (opcional)" class="w-full p-2 text-sm bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
            <textarea id="rawInput" class="w-full h-24 p-3 text-xs font-mono bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none resize-none" placeholder="Cole o output do terminal (ns) aqui..."></textarea>
            <button onclick="S_HandleAddRun()" class="mt-1 px-4 py-2 bg-blue-600 text-white font-medium rounded-lg hover:bg-blue-700 transition">Guardar Teste</button>
            <p class="text-xs text-slate-400 mt-2">Aceita execução única ou agregados (_mean/_median/_stddev/_cv). Quando há agregados, a estatística é escolhida pelo CV: usa-se a <b>mediana</b> se cv &gt; 10% ou |média − mediana| &gt; 0,5×σ; caso contrário, a <b>média</b>.</p>
        </div>

        <div class="flex flex-col justify-between">
            <div>
                <h3 class="text-sm font-bold text-slate-500 uppercase tracking-wider mb-3">Modo de Visualização</h3>
                <div class="flex bg-slate-100 p-1 rounded-lg w-fit">
                    <button id="btnViewCurrent" onclick="S_SetViewMode('current')" class="px-4 py-2 rounded-md font-medium text-sm transition-all bg-white shadow text-blue-600">Comparação de Suítes</button>
                    <button id="btnViewHistory" onclick="S_SetViewMode('history')" class="px-4 py-2 rounded-md font-medium text-sm transition-all text-slate-500 hover:text-slate-800">Evolução Histórica</button>
                </div>
            </div>

            <div id="runSelectionPanel" class="mt-4 flex flex-col gap-2">
                <label class="text-sm font-bold text-slate-500 uppercase tracking-wider block">Teste Selecionado</label>

                <div id="editNameContainer" class="hidden gap-2 w-full">
                    <input type="text" id="editNameInput" class="flex-1 p-2 bg-white border border-blue-400 rounded-lg focus:outline-none">
                    <button onclick="S_HandleRenameRun()" class="px-3 py-2 bg-green-50 text-green-700 border border-green-200 rounded-lg hover:bg-green-100">✔</button>
                    <button onclick="S_ToggleEditName(false)" class="px-3 py-2 bg-slate-100 text-slate-600 border border-slate-200 rounded-lg hover:bg-slate-200">✖</button>
                </div>

                <div id="selectNameContainer" class="flex gap-2 w-full items-center">
                    <select id="activeRunSelect" onchange="S_HandleRunChange()" class="flex-1 p-2 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none truncate"></select>
                    <div id="runActions" class="flex gap-1 shrink-0 hidden">
                        <button onclick="S_ToggleEditName(true)" class="px-3 py-2 bg-blue-50 text-blue-600 border border-blue-200 hover:bg-blue-100 rounded-lg font-medium transition-colors" title="Renomear">✎</button>
                        <button onclick="S_HandleDeleteRun()" class="px-3 py-2 bg-red-50 text-red-600 border border-red-200 hover:bg-red-100 rounded-lg font-medium transition-colors" title="Excluir">🗑</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Selecionador de Métricas Globais -->
    <div id="metricSelector" class="mb-8 flex flex-wrap gap-3"></div>

    <!-- Containers Principais -->
    <div id="currentViewContainer" class="grid grid-cols-1 lg:grid-cols-2 gap-8"></div>
    <div id="historyViewContainer" class="grid grid-cols-1 lg:grid-cols-2 gap-8 hidden"></div>
</div>

<script>
    function S_LibBase(lib) {
        const m = lib.match(/^(.*?)\s*\((.+)\)$/);
        return m ? m[1].trim() : lib;
    }

    const g_colorCache = {};

    function S_LibColor(lib) {
        if (g_colorCache[lib]) return g_colorCache[lib];
        const base = S_LibBase(lib);
        let h = 0;
        for (let i = 0; i < base.length; i++) h = (h * 31 + base.charCodeAt(i)) % 360;
        // Variantes usam o mesmo matiz da lib base, só com luminosidade diferente
        const color = (base === lib) ? `hsl(${h}, 70%, 55%)` : `hsl(${h}, 65%, 68%)`;
        g_colorCache[lib] = color;
        return color;
    }

    function S_SortLibs(libs) {
        const bases = libs.filter(l => S_LibBase(l) === l).sort((a, b) => a.localeCompare(b));
        const variants = libs.filter(l => S_LibBase(l) !== l).sort((a, b) => a.localeCompare(b));
        return [...bases, ...variants];
    }

    const METRICS = [
        { id: 'mb_s', label: 'Taxa (MiB/s)' },
        { id: 'time', label: 'Tempo (µs)' },
        { id: 'cpu', label: 'CPU Tempo (µs)' },
        { id: 'iterations', label: 'Iterações' }
    ];

    let g_state = {
        runs: [],
        activeRunId: null,
        metric: 'mb_s',
        viewMode: 'current',
        hiddenLibs: {},
        hiddenTests: {},
        logScales: {},
        collapsedRows: {}
    };

    let g_charts = {};

    function S_Init() {
        Chart.defaults.font.family = 'ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif';
        Chart.defaults.plugins.tooltip.backgroundColor = '#ffffff';
        Chart.defaults.plugins.tooltip.titleColor = '#1e293b';
        Chart.defaults.plugins.tooltip.bodyColor = '#475569';
        Chart.defaults.plugins.tooltip.borderColor = '#e2e8f0';
        Chart.defaults.plugins.tooltip.borderWidth = 1;
        Chart.defaults.plugins.tooltip.padding = 12;
        Chart.defaults.plugins.tooltip.boxPadding = 6;
        Chart.defaults.plugins.tooltip.usePointStyle = true;

        S_LoadState();
        S_UpdateUI();
    }

    const S_STAT_SUFFIX = /_(mean|median|stddev|cv)$/;

    // Canonical benchmark name:
    //   Suite/Library/Variant/Test
    // Examples:
    //   Parse/Simdjson/DOM/Medium
    //   Parse/Rapidjson/InSitu/Large
    //   Build/Boost/Base/Object
    // The parser deliberately knows nothing about specific libraries or variants.
    function S_ParseName(rawName) {
        const parts = rawName.split('/');
        if (parts.length < 4) return null;

        const suite = parts[0];
        const library = parts[1];
        const variant = parts[2];
        const test = parts.slice(3).join('/');
        if (!suite || !library || !variant || !test) return null;

        const lib = variant === 'Base' ? library : `${library} (${variant})`;
        return { suite, library, variant, lib, test };
    }

    function S_ParseBytesPerSecond(parts) {
        for (const p of parts) {
            if (p.startsWith('bytes_per_second=')) {
                const match = p.match(/bytes_per_second=([\d.]+)(Mi\/s|Gi\/s)/);
                if (match) {
                    const val = parseFloat(match[1]);
                    return match[2] === 'Gi/s' ? val * 1024 : val;
                }
            }
        }
        return null;
    }

    function S_IsValidBenchLine(line) {
        return /^\S+\s+[\d.]+\s+(ns|%)\s+[\d.]+\s+(ns|%)\s+\d+/.test(line);
    }

    function S_UnwrapLines(text) {
        const lines = [];
        for (let raw of text.split('\n')) {
            raw = raw.trim();
            if (!raw || raw.startsWith('-')) continue;
            const isNewRecord = /^\S+\/\S+\s+/.test(raw) && S_IsValidBenchLine(raw);
            if (lines.length && !isNewRecord) {
                const prev = lines[lines.length - 1];
                const joined = prev + raw;
                lines[lines.length - 1] = S_IsValidBenchLine(joined) ? joined : prev + ' ' + raw;
            } else {
                lines.push(raw);
            }
        }
        return lines;
    }

    function S_ParseSimpleLines(lines) {
        const results = [];
        for (const line of lines) {
            if (!line.includes('/')) continue;
            const parts = line.split(/\s+/);
            if (parts.length < 4) continue;

            const timeNs = parseFloat(parts[1]);
            const cpuNs = parseFloat(parts[3]);
            if (isNaN(timeNs) || isNaN(cpuNs)) continue;

            const name = S_ParseName(parts[0]);
            if (!name) continue;

            const it = parseInt(parts[5]);
            results.push({
                ...name,
                time: timeNs / 1000,
                cpu: cpuNs / 1000,
                iterations: isNaN(it) ? null : it,
                mb_s: S_ParseBytesPerSecond(parts)
            });
        }
        return results;
    }

    function S_ParseAggregateLines(lines) {
        const groups = {};
        for (const line of lines) {
            const parts = line.split(/\s+/);
            if (parts.length < 6) continue;

            const m = parts[0].match(S_STAT_SUFFIX);
            if (!m) continue;

            const t = parseFloat(parts[1]);
            const c = parseFloat(parts[3]);
            if (isNaN(t) || isNaN(c)) continue;

            const base = parts[0].replace(S_STAT_SUFFIX, '');
            if (!groups[base]) groups[base] = {};
            const g = groups[base];

            const it = parseInt(parts[5]);
            if (!isNaN(it)) g.iterations = it;

            if (m[1] === 'cv') {
                g.cv = t;
            } else {
                g[m[1]] = { time: t / 1000, cpu: c / 1000, mb_s: S_ParseBytesPerSecond(parts) };
            }
        }

        const results = [];
        for (const [base, g] of Object.entries(groups)) {
            if (!g.mean || !g.median) continue;

            const name = S_ParseName(base);
            if (!name) continue;

            let useMedian = (g.cv != null && g.cv > 10);
            if (!useMedian && g.stddev && Math.abs(g.mean.time - g.median.time) > 0.5 * g.stddev.time) useMedian = true;

            const chosen = useMedian ? g.median : g.mean;
            results.push({
                ...name,
                time: chosen.time,
                cpu: chosen.cpu,
                iterations: g.iterations != null ? g.iterations : null,
                mb_s: chosen.mb_s,
                stat: useMedian ? 'median' : 'mean',
                cv: g.cv != null ? g.cv : null
            });
        }
        return results;
    }

    function S_ParseBenchmarkText(text) {
        const lines = S_UnwrapLines(text);
        const isAggregate = lines.some(l => S_STAT_SUFFIX.test(l.split(/\s+/)[0]));
        return isAggregate ? S_ParseAggregateLines(lines) : S_ParseSimpleLines(lines);
    }

    function S_LoadState() {
        let saved = null;
        try { saved = JSON.parse(localStorage.getItem('benchJson_runs')); } catch (e) {}

        g_state.runs = (saved && Array.isArray(saved)) ? saved : [];
        g_state.activeRunId = g_state.runs.length ? g_state.runs[g_state.runs.length - 1].id : null;
    }

    function S_SaveState() {
        localStorage.setItem('benchJson_runs', JSON.stringify(g_state.runs));
    }

    function S_SetViewMode(mode) { g_state.viewMode = mode; S_UpdateUI(); }
    function S_SetMetric(metricId) { g_state.metric = metricId; S_UpdateUI(); }

    function S_HandleAddRun() {
        const rawInput = document.getElementById('rawInput').value;
        const newName = document.getElementById('newRunName').value;
        if (!rawInput.trim()) return;

        const data = S_ParseBenchmarkText(rawInput);
        if (data.length === 0) return alert("Nenhum dado válido encontrado.");

        const id = `local-${Date.now()}`;
        g_state.runs.push({ id, name: newName.trim() || `Teste ${g_state.runs.length}`, data, createdAt: Date.now() });
        g_state.activeRunId = id;
        S_SaveState();

        document.getElementById('rawInput').value = '';
        document.getElementById('newRunName').value = '';
        S_UpdateUI();
    }

    function S_HandleDeleteRun() {
        if (!g_state.activeRunId) return;
        g_state.runs = g_state.runs.filter(r => r.id !== g_state.activeRunId);
        g_state.activeRunId = g_state.runs.length ? g_state.runs[g_state.runs.length - 1].id : null;
        S_SaveState();
        S_UpdateUI();
    }

    function S_ToggleEditName(isEditing) {
        const editContainer = document.getElementById('editNameContainer');
        const selectContainer = document.getElementById('selectNameContainer');
        const editInput = document.getElementById('editNameInput');

        if (isEditing) {
            const run = g_state.runs.find(r => r.id === g_state.activeRunId);
            editInput.value = run ? run.name : '';
            editContainer.classList.remove('hidden');
            editContainer.classList.add('flex');
            selectContainer.classList.add('hidden');
            editInput.focus();
        } else {
            editContainer.classList.add('hidden');
            editContainer.classList.remove('flex');
            selectContainer.classList.remove('hidden');
        }
    }

    function S_HandleRenameRun() {
        const newName = document.getElementById('editNameInput').value.trim();
        if (!newName || !g_state.activeRunId) return S_ToggleEditName(false);

        const run = g_state.runs.find(r => r.id === g_state.activeRunId);
        if (run) run.name = newName;
        S_SaveState();
        S_ToggleEditName(false);
        S_UpdateUI();
    }

    function S_HandleRunChange() {
        g_state.activeRunId = document.getElementById('activeRunSelect').value;
        S_UpdateUI();
    }

    function S_ToggleTestVisibility(suite, test) {
        const key = `${suite}-${test}`;
        g_state.hiddenTests[key] = !g_state.hiddenTests[key];
        S_UpdateUI();
    }

    function S_ToggleLibVisibility(key) {
        g_state.hiddenLibs[key] = !g_state.hiddenLibs[key];
        S_UpdateUI();
    }

    function S_ToggleLogScale(suite) {
        g_state.logScales[suite] = !g_state.logScales[suite];
        S_UpdateUI();
    }

    function S_ToggleCollapse(suite) {
        g_state.collapsedRows[suite] = !g_state.collapsedRows[suite];
        S_UpdateUI();
    }

    function S_FormatYAxis(value) {
        if (value >= 1000000) return (value / 1000000).toFixed(1) + 'M';
        if (value >= 1000) return (value / 1000).toFixed(1) + 'k';
        return value.toLocaleString(undefined, { maximumFractionDigits: 1 });
    }

    function S_FormatTooltip(val) {
        if (val == null) return 'sem dados';
        if (g_state.metric === 'mb_s') return val.toLocaleString(undefined, { maximumFractionDigits: 2 }) + ' MiB/s';
        if (g_state.metric === 'time' || g_state.metric === 'cpu') return val.toLocaleString(undefined, { maximumFractionDigits: 2 }) + ' µs';
        return val.toLocaleString();
    }

    function S_ChartScales(isLog, smallFont) {
        return {
            x: { grid: { display: false }, ticks: smallFont ? { maxRotation: 45, font: { size: 9 } } : {} },
            y: {
                type: isLog ? 'logarithmic' : 'linear',
                beginAtZero: !isLog,
                ticks: { callback: S_FormatYAxis, ...(smallFont ? { font: { size: 10 } } : {}) }
            }
        };
    }

    // ---- Construção das partes comuns do card de suíte ----

    function S_BuildCardHeader(suite, index, isLog) {
        const metricLabel = METRICS.find(m => m.id === g_state.metric).label;
        const canLog = g_state.metric === 'time' || g_state.metric === 'cpu';
        const isCollapsed = !!g_state.collapsedRows[suite];
        return `
            <div class="mb-4 flex justify-between items-start gap-2">
                <div class="cursor-pointer hover:opacity-75 transition-opacity" onclick="S_ToggleCollapse('${suite}')" title="Clique para contrair/expandir">
                    <h2 class="text-xl font-bold text-slate-800 select-none flex items-center gap-2">${index + 1}. ${suite} <span class="text-sm text-slate-400">${isCollapsed ? '▼' : '▲'}</span></h2>
                    <p class="text-slate-500 mt-1 text-sm">Baseado em ${metricLabel}</p>
                </div>
                ${!isCollapsed && canLog ? `
                    <button onclick="S_ToggleLogScale('${suite}')" class="shrink-0 text-xs font-bold px-3 py-1.5 rounded-md border ${isLog ? 'bg-slate-800 text-white border-slate-800' : 'bg-white text-slate-600 border-slate-300 hover:bg-slate-50'}">
                        ${isLog ? 'Escala Log' : 'Linear'}
                    </button>
                ` : ''}
            </div>`;
    }

    function S_BuildTestChips(suite, tests) {
        if (!tests.length) return '';
        return `
            <div class="mb-4 flex flex-wrap gap-2">
                ${tests.map(test => `
                    <button onclick="S_ToggleTestVisibility('${suite}', '${test}')" class="text-xs px-2 py-1 rounded border transition-all ${g_state.hiddenTests[`${suite}-${test}`] ? 'line-through text-slate-400 border-slate-200 bg-slate-50' : 'text-slate-700 border-slate-300 hover:bg-slate-100'}">
                        ${test}
                    </button>
                `).join('')}
            </div>`;
    }

    function S_BuildLegend(suite, libs) {
        if (!libs.length) return '';
        return `
            <div class="flex flex-wrap justify-center gap-3 mb-2">
                ${libs.map(lib => `
                    <div onclick="S_ToggleLibVisibility('${suite}-${lib}')" class="flex items-center cursor-pointer text-xs transition-opacity hover:opacity-80">
                        <span class="w-3 h-3 rounded-full mr-1.5 opacity-${g_state.hiddenLibs[`${suite}-${lib}`] ? '30' : '100'}" style="background-color: ${S_LibColor(lib)}"></span>
                        <span class="${g_state.hiddenLibs[`${suite}-${lib}`] ? 'line-through text-slate-400' : 'text-slate-700'}">${lib}</span>
                    </div>
                `).join('')}
            </div>`;
    }

    function S_IsSmallSuite(suite) {
        if (['KeyAccess', 'TypeChecking', 'PathTraversal', 'ArrayIteration'].includes(suite)) return true;
        if (suite === 'RoundTrip' && g_state.metric !== 'mb_s') return true;
        return false;
    }

    function S_SuiteInfo(latestRun) {
        // Retorna, por suíte: dados, libs ativas, lista de testes e testes visíveis
        if (!latestRun) return [];
        const suites = Array.from(new Set(latestRun.data.map(d => d.suite)));
        const allLibs = S_SortLibs(Array.from(new Set(latestRun.data.map(d => d.lib))));
        return suites.map(suite => {
            const suiteData = latestRun.data.filter(d => d.suite === suite);
            const hasMetric = suiteData.some(d => d[g_state.metric] != null && !isNaN(d[g_state.metric]));
            if (!hasMetric) return null;

            const allTests = Array.from(new Set(suiteData.map(d => d.test)));
            const visibleTests = allTests.filter(t => !g_state.hiddenTests[`${suite}-${t}`]);

            const libs = allLibs.filter(lib =>
                allTests.some(t => {
                    const entry = suiteData.find(d => d.test === t && d.lib === lib);
                    return entry && entry[g_state.metric] != null;
                })
            );

            return { suite, suiteData, allTests, visibleTests, libs, isLog: !!g_state.logScales[suite], small: S_IsSmallSuite(suite) };
        }).filter(Boolean);
    }

    // ---- Modo: Comparação de Suítes ----

    function S_RenderCurrentView(activeRun) {
        const container = document.getElementById('currentViewContainer');
        if (!activeRun || activeRun.data.length === 0) {
            container.innerHTML = '<div class="lg:col-span-2 text-center py-12 text-slate-500">Nenhum teste carregado. Cole o output do benchmark no painel acima e clique em "Guardar Teste".</div>';
            return;
        }
        const infos = S_SuiteInfo(activeRun);
        const chartJobs = [];

        container.innerHTML = infos.map((info, index) => {
            const isCollapsed = !!g_state.collapsedRows[info.suite];
            const chartId = `chart_${info.suite.replace(/[^a-zA-Z0-9]/g, '_')}`;
            if (!isCollapsed) chartJobs.push({ chartId, ...info });
            return `
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 ${info.small ? '' : 'lg:col-span-2'}">
                    ${S_BuildCardHeader(info.suite, index, info.isLog)}
                    ${isCollapsed ? '' : `
                    ${S_BuildTestChips(info.suite, info.allTests)}
                    ${S_BuildLegend(info.suite, info.libs)}
                    <div class="min-h-[350px] relative">
                        <canvas id="${chartId}"></canvas>
                    </div>`}
                </div>`;
        }).join('') || '<div class="lg:col-span-2 text-center py-12 text-slate-500">Não há dados disponíveis para esta métrica.</div>';

        chartJobs.forEach(({ chartId, suite, visibleTests, libs, suiteData, isLog }) => {
            const ctx = document.getElementById(chartId).getContext('2d');
            const datasets = libs.map(lib => {
                const entries = visibleTests.map(test => suiteData.find(d => d.test === test && d.lib === lib));
                return {
                    label: lib,
                    data: entries.map(e => e && e[g_state.metric] != null ? e[g_state.metric] : null),
                    meta: entries.map(e => e && e.stat ? `${e.stat === 'median' ? 'mediana' : 'média'}${e.cv != null ? ', cv ' + e.cv.toFixed(1) + '%' : ''}` : ''),
                    backgroundColor: S_LibColor(lib),
                    hidden: !!g_state.hiddenLibs[`${suite}-${lib}`],
                    borderRadius: 4,
                    borderSkipped: false
                };
            });

            g_charts[chartId] = new Chart(ctx, {
                type: 'bar',
                data: { labels: visibleTests, datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: { callbacks: { label: (c) => { const meta = c.dataset.meta && c.dataset.meta[c.dataIndex]; return `${c.dataset.label}: ${S_FormatTooltip(c.raw)}${meta ? ' (' + meta + ')' : ''}`; } } }
                    },
                    scales: S_ChartScales(isLog, false)
                }
            });
        });
    }


    // ---- Modo: Evolução Histórica ----

    function S_RenderHistoryView() {
        const container = document.getElementById('historyViewContainer');
        const latestRun = g_state.runs[g_state.runs.length - 1];
        if (!latestRun) {
            container.innerHTML = '<div class="lg:col-span-2 text-center py-12 text-slate-500">Nenhum teste no histórico. Cole o output do benchmark no painel acima e clique em "Guardar Teste".</div>';
            return;
        }

        const infos = S_SuiteInfo(latestRun);
        const chartJobs = [];
        const labels = g_state.runs.map(r => r.name);

        container.innerHTML = infos.map((info, index) => {
            const isCollapsed = !!g_state.collapsedRows[info.suite];
            const cells = isCollapsed ? '' : info.visibleTests.map(test => {
                const chartId = `hist_${info.suite.replace(/[^a-zA-Z0-9]/g, '_')}_${test.replace(/[^a-zA-Z0-9]/g, '_')}`;
                chartJobs.push({ chartId, suite: info.suite, test, libs: info.libs, isLog: info.isLog });
                return `
                    <div class="flex flex-col bg-slate-50 p-3 rounded-xl border border-slate-100">
                        <h3 class="text-sm font-semibold text-slate-600 mb-3 truncate" title="${test}">${test}</h3>
                        <div class="h-44 relative">
                            <canvas id="${chartId}"></canvas>
                        </div>
                    </div>`;
            }).join('');

            return `
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                    ${S_BuildCardHeader(info.suite, index, info.isLog)}
                    ${isCollapsed ? '' : `
                    ${S_BuildTestChips(info.suite, info.allTests)}
                    ${S_BuildLegend(info.suite, info.libs)}
                    ${info.visibleTests.length
                ? `<div class="grid ${info.small ? 'grid-cols-1 md:grid-cols-2' : 'grid-cols-1 md:grid-cols-2 xl:grid-cols-3'} gap-6">${cells}</div>`
                : '<p class="text-center text-sm text-slate-400 py-6">Todos os testes estão ocultos. Clique nos chips acima para reexibir.</p>'}`}
                </div>`;
        }).join('') || '<div class="lg:col-span-2 text-center py-12 text-slate-500">Não há dados no histórico.</div>';

        chartJobs.forEach(({ chartId, suite, test, libs, isLog }) => {
            const ctx = document.getElementById(chartId).getContext('2d');
            const datasets = libs.map(lib => {
                const entries = g_state.runs.map(run => run.data.find(d => d.suite === suite && d.test === test && d.lib === lib));
                return {
                    label: lib,
                    data: entries.map(e => e && e[g_state.metric] != null ? e[g_state.metric] : null),
                    meta: entries.map(e => e && e.stat ? `${e.stat === 'median' ? 'mediana' : 'média'}${e.cv != null ? ', cv ' + e.cv.toFixed(1) + '%' : ''}` : ''),
                    borderColor: S_LibColor(lib),
                    backgroundColor: S_LibColor(lib),
                    tension: 0.2,
                    borderWidth: 2,
                    pointRadius: 3,
                    hidden: !!g_state.hiddenLibs[`${suite}-${lib}`],
                    spanGaps: true
                };
            });

            g_charts[chartId] = new Chart(ctx, {
                type: 'line',
                data: { labels, datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: { callbacks: { label: (c) => { const meta = c.dataset.meta && c.dataset.meta[c.dataIndex]; return `${c.dataset.label}: ${S_FormatTooltip(c.raw)}${meta ? ' (' + meta + ')' : ''}`; } } }
                    },
                    scales: S_ChartScales(isLog, true)
                }
            });
        });
    }


    function S_UpdateUI() {
        const activeRun = g_state.runs.find(r => r.id === g_state.activeRunId) || g_state.runs[g_state.runs.length - 1] || null;

        document.getElementById('btnViewCurrent').className = `px-4 py-2 rounded-md font-medium text-sm transition-all ${g_state.viewMode === 'current' ? 'bg-white shadow text-blue-600' : 'text-slate-500 hover:text-slate-800'}`;
        document.getElementById('btnViewHistory').className = `px-4 py-2 rounded-md font-medium text-sm transition-all ${g_state.viewMode === 'history' ? 'bg-white shadow text-blue-600' : 'text-slate-500 hover:text-slate-800'}`;

        document.getElementById('activeRunSelect').innerHTML =
            g_state.runs.map(r => `<option value="${r.id}" ${r.id === g_state.activeRunId ? 'selected' : ''}>${r.name}</option>`).join('');

        document.getElementById('runSelectionPanel').classList.toggle('hidden', g_state.viewMode !== 'current');
        document.getElementById('runActions').classList.toggle('hidden', g_state.runs.length === 0);

        document.getElementById('metricSelector').innerHTML = METRICS.map(m => `
            <button onclick="S_SetMetric('${m.id}')" class="px-5 py-2.5 rounded-lg font-medium transition-all shadow-sm ${g_state.metric === m.id ? 'bg-blue-600 text-white shadow-blue-500/30' : 'bg-white text-slate-600 hover:bg-slate-100'}">
                ${m.label}
            </button>
        `).join('');

        document.getElementById('currentViewContainer').classList.toggle('hidden', g_state.viewMode !== 'current');
        document.getElementById('historyViewContainer').classList.toggle('hidden', g_state.viewMode !== 'history');

        Object.values(g_charts).forEach(c => c.destroy());
        g_charts = {};

        if (g_state.viewMode === 'current') S_RenderCurrentView(activeRun);
        else S_RenderHistoryView();
    }

    document.addEventListener('DOMContentLoaded', S_Init);
</script>
</body>
</html>
