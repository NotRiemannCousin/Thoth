<form class="side-box new-post" data-api="/api/login">
  <h3>Log in / Sign up</h3>
  <input type="text" name="username" placeholder="Username..." maxlength="24" required>
  <input type="password" name="password" placeholder="Password..." required>
  <button type="submit">ENTER</button>
  <p class="warning">Toy auth, on purpose: an unknown username creates the account and passwords sit in plain text in memory. Never type a real one.</p>
</form>
