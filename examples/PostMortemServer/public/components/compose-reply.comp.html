<form class="side-box new-post" data-api="/api/replies">
  <h3>↩ Reply to <span class="quote">&gt;&gt;#%%{0:0>4}%%</span></h3>
  <input type="hidden" name="target" value="%%{0}%%" data-number>
  <textarea name="content" placeholder="Write your reply..." maxlength="2000" required autofocus></textarea>
  <button type="submit">REPLY</button>
  <a class="cancel" href="/">cancel</a>
</form>
